<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>导了吗</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #0f0f1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Header */
        .header {
            padding: 30px 0 20px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Timer Card */
        .timer-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 40px 20px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .timer-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,107,107,0.08), transparent 60%);
            pointer-events: none;
        }

        .days-number {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .days-label {
            font-size: 1.1rem;
            color: #aaa;
            margin-top: 4px;
        }
        .time-detail {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #888;
        }
        .time-detail span {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-detail .num {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ddd;
        }

        /* Status Badge */
        .status {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 20px;
        }
        .status.clean { background: rgba(46,213,115,0.2); color: #2ed573; }
        .status.fail { background: rgba(255,107,107,0.2); color: #ff6b6b; }
        .status.waiting { background: rgba(255,165,2,0.2); color: #ffa502; }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            flex: 1;
            min-width: 120px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 4px 15px rgba(238,90,36,0.3);
        }
        .btn-danger {
            background: rgba(255,255,255,0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Milestones */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ccc;
            text-align: left;
            margin: 30px 0 12px;
        }
        .milestones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .milestone {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .milestone .icon { font-size: 1.3rem; margin-bottom: 4px; }
        .milestone .label { font-size: 0.75rem; color: #888; }
        .milestone .day { font-size: 0.85rem; font-weight: 700; color: #555; margin-top: 2px; }
        .milestone.achieved {
            border-color: rgba(46,213,115,0.3);
            background: rgba(46,213,115,0.08);
        }
        .milestone.achieved .day { color: #2ed573; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-card .num {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffa502;
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        /* Reset confirm modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 320px;
            width: 100%;
            text-align: center;
        }
        .modal h3 { font-size: 1.2rem; margin-bottom: 8px; }
        .modal p { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
        .modal .btn-group { margin-top: 0; }

        /* Quote */
        .quote {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border-left: 3px solid #ff6b6b;
            font-size: 0.85rem;
            color: #888;
            line-height: 1.6;
            min-height: 60px;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding-bottom: 30px;
            font-size: 0.75rem;
            color: #444;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .pulse {
            animation: pulse 2s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>导了吗</h1>
            <p>自律即自由</p>
        </div>

        <!-- Timer -->
        <div class="timer-card" id="timerCard">
            <div class="days-number" id="daysDisplay">0</div>
            <div class="days-label">天</div>
            <div class="time-detail">
                <span><span class="num" id="hoursDisplay">0</span>小时</span>
                <span><span class="num" id="minutesDisplay">0</span>分钟</span>
                <span><span class="num" id="secondsDisplay">0</span>秒</span>
            </div>
            <div class="status waiting" id="statusBadge">等待开始</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="startBtn">开始挑战</button>
                <button class="btn btn-danger" id="failBtn" style="display:none">我失败了</button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="section-title">📊 统计</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="num" id="longestStreak">0</div>
                <div class="label">最长纪录（天）</div>
            </div>
            <div class="stat-card">
                <div class="num" id="totalAttempts">0</div>
                <div class="label">挑战次数</div>
            </div>
        </div>

        <!-- Milestones -->
        <div class="section-title">🏆 里程碑</div>
        <div class="milestones" id="milestones"></div>

        <!-- Quote -->
        <div class="quote" id="quoteDisplay"></div>

        <div class="footer">导了吗 v1.0 · 数据仅保存在本地</div>
    </div>

    <!-- Reset Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>确认失败？</h3>
            <p id="modalInfo">这次坚持了 0 天</p>
            <div class="btn-group">
                <button class="btn btn-primary" id="confirmFail">确认</button>
                <button class="btn btn-secondary" id="cancelFail">取消</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
